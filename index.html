<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>InsightTrack - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="app.js" defer></script>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
<div class="card p-4 shadow" style="width: 380px;">
    <h3 class="text-center mb-3">InsightTrack</h3>

    <!-- ÁREA DE LOGIN -->
    <div id="login-area">
        <h5 class="mb-3">Entrar</h5>
        <input id="email" class="form-control mb-2" type="email" placeholder="E-mail">
        <input id="senha" class="form-control mb-3" type="password" placeholder="Senha">
        <button class="btn btn-primary w-100" onclick="login()">Entrar</button>
        <p id="login-status" class="text-danger mt-2 text-center"></p>

        <hr>
        <p class="text-center mb-1">Não tem conta?</p>
        <button class="btn btn-outline-secondary w-100" type="button" onclick="mostrarCadastro()">
            Cadastrar novo usuário
        </button>
    </div>

    <!-- ÁREA DE CADASTRO -->
    <div id="cadastro-area" style="display: none;">
        <h5 class="mb-3">Cadastrar</h5>
        <input id="nomeCadastro" class="form-control mb-2" placeholder="Nome completo">
        <input id="emailCadastro" class="form-control mb-2" type="email" placeholder="E-mail">
        <input id="senhaCadastro" class="form-control mb-3" type="password" placeholder="Senha">
        <button class="btn btn-success w-100" onclick="cadastrar()">Cadastrar</button>
        <p id="cadastro-status" class="mt-2 text-center"></p>

        <hr>
        <button class="btn btn-outline-secondary w-100" type="button" onclick="mostrarLogin()">
            Voltar para login
        </button>
    </div>
</div>
</body>
</html>
