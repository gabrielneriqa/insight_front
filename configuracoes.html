<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Configurações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="configuracoes.js" defer></script>
    <style>

        .custom-fixed-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1030; /* Garante que fique acima de outros elementos */
        }
        body {
            padding-bottom: 60px;
            min-height: 100vh;
        }

        footer.custom-fixed-footer {
            margin-top: 0 !important;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Configurações</span>
</nav>

<div class="container mt-4">

    <h3>Escolha o que deseja alterar:</h3>

    <div class="d-flex gap-3 mb-4">
        <button class="btn btn-primary" onclick="mostrar('nome')">Nome</button>
        <button class="btn btn-primary" onclick="mostrar('email')">Email</button>
        <button class="btn btn-primary" onclick="mostrar('senha')">Senha</button>
    </div>

    <!-- FORM ALTERAR NOME -->
    <div id="box-nome" class="card p-3 mb-3 d-none">
        <h4>Alterar Nome</h4>
        <input id="novoNome" class="form-control mb-2" placeholder="Novo nome">
        <button class="btn btn-success" onclick="salvarNome()">Salvar</button>
    </div>

    <!-- FORM ALTERAR EMAIL -->
    <div id="box-email" class="card p-3 mb-3 d-none">
        <h4>Alterar Email</h4>
        <input id="novoEmail" class="form-control mb-2" type="email" placeholder="Novo email">
        <button class="btn btn-success" onclick="salvarEmail()">Salvar</button>
    </div>



    <!-- FORM ALTERAR SENHA -->
    <div id="box-senha" class="card p-3 mb-3 d-none">
        <h4>Alterar Senha</h4>

        <label class="form-label">Senha atual</label>
        <input id="senhaAtual" type="password" class="form-control mb-2" placeholder="Digite sua senha atual">

        <label class="form-label">Nova senha</label>
        <input id="novaSenha" type="password" class="form-control mb-3" placeholder="Digite a nova senha">

        <button class="btn btn-success" onclick="salvarSenha()">Salvar</button>
    </div>



    <span id="status" class="mt-3 d-block"></span>

    <a href="dashboard.html" class="btn btn-secondary mt-3">Voltar</a>
</div>

<footer class="py-3 bg-dark border-top custom-fixed-footer">
    <div class="container text-center">
        <span class="text-white">© InsightTrack - Direitos Reservados</span>
    </div>
</footer>

</body>
</html>
