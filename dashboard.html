<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>InsightTrack - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard.js" defer></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">

    <a href="configuracoes.html" class="me-3">
        <img src="https://cdn-icons-png.flaticon.com/512/3524/3524636.png"
             width="28"
             style="filter: invert(1); cursor: pointer;">
    </a>
    <span class="navbar-brand">InsightTrack Dashboard</span>
    <button class="btn btn-outline-light" onclick="logout()">Sair</button>
</nav>

<div class="container mt-4">

    <!-- MINHAS CAMPANHAS -->
    <h3>Minhas Campanhas</h3>
    <div class="d-flex mb-3">
        <input id="nomeCampanha" class="form-control me-2" placeholder="Nome da campanha">
        <button class="btn btn-success" onclick="criarCampanha()">Criar</button>
    </div>

    <ul id="listaCampanhas" class="list-group mb-4"></ul>

    <!-- CADASTRAR RESULTADO -->
    <div class="card p-3 mb-4">
        <h4>Cadastrar Resultado</h4>
        <div class="row g-2">
            <div class="col-md-4">
                <label class="form-label">Campanha</label>
                <select id="campanhaSelect" class="form-select">
                    <option value="">Selecione uma campanha</option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">Alcance</label>
                <input id="alcance" type="number" class="form-control">
            </div>

            <div class="col-md-2">
                <label class="form-label">Engajamento</label>
                <input id="engajamento" type="number" class="form-control">
            </div>

            <div class="col-md-2">
                <label class="form-label">Cliques</label>
                <input id="cliques" type="number" class="form-control">
            </div>

            <div class="col-md-2">
                <label class="form-label">Leads</label>
                <input id="leads" type="number" class="form-control">
            </div>

            <div class="col-md-3 mt-2">
                <label class="form-label">Data</label>
                <input id="dataResultado" type="date" class="form-control">
            </div>

            <div class="col-12 mt-3">
                <button class="btn btn-primary" onclick="salvarResultado()">Salvar Resultado</button>
                <span id="resultadoStatus" class="ms-3 text-success"></span>
            </div>
        </div>
    </div>

    <!-- RELATÓRIO -->
    <h4>Relatório</h4>
    <canvas id="grafico" height="100"></canvas>
</div>

<!-- RODAPE -->
<footer class="py-3 mt-5 bg-white border-top">
    <div class="container text-center">
        <span class="text-muted">© InsightTrack - Direitos Reservados</span>
    </div>
</footer>

</body>
</html>
